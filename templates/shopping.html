<script>

    // const products = [
    //     { name: 'Bamboo Charcoal Toothbrush', price: 150, category: 'Eco-Friendly Home Products', seller: 'Amazon' },
    //     { name: 'Recycled Notebook', price: 120, category: 'Recycled Stationary', seller:'Amazon' },
    //     { name: 'Biodegradable Garbage Bags', price: 300, category: 'Garbage Bags' , seller:'Jiomart'},
    //     { name: 'Biodegradable Garbage Bags', price: 300, category: 'Garbage Bags' , seller:'Jiomart'},
    //     { name: 'Reusable Kitchen Wrap', price: 800, category: 'Kitchen Utilities' , seller:'Jiomart'}
    // ];


    let cart = [];
    const productList = document.getElementById('productList');
    const cartSidebar = document.getElementById('cartSidebar');
    const cartItems = document.getElementById('cartItems');
    const totalPriceElement = document.getElementById('totalPrice');
    const cartCountElement = document.getElementById('cartCount');
    const discountAmountElement = document.getElementById('discountAmount');


    function displayProducts(products) {
        const productList = document.getElementById('productList');
        productList.innerHTML = ''; // ✅ Clear previous products

        if (!products || products.length === 0) {
            productList.innerHTML = "<p>No products available.</p>";
            return;
        }

        console.log("Displaying products:", products); // ✅ Debugging log

        products.forEach((product, index) => {
            if (!product.name || !product.price || !product.seller) {
                console.warn("Skipping invalid product:", product);
                return;
            }

            const productCard = document.createElement('div');
            productCard.classList.add('product-card');

            // Ensure price is properly formatted
            const price = parseFloat(product.price).toFixed(2);

            productCard.innerHTML = `
           <div class="product-image"><img src="${product.image}" alt="${product.name}"></div>
            <h3 style="font-family: 'Poppins', sans-serif; font-size: 22px; font-weight:500; color:#59855C;">${product.name}</h3>
            <h6 style="font-family: 'Poppins', sans-serif; font-size: 14px; font-weight:400; color:#59855C;">Seller : ${product.seller}</h6>
            <p style="font-family: 'Poppins', sans-serif; font-size: 36px; font-weight:600; color:#59855C;">₹${product.price}</p>
            <button style="background-color: #59855C; width:100%; border-radius:50px; font-size:20px; font-weight:400;"onclick="addToCart(${index})">Add to cart</button>
        `;
            productList.appendChild(productCard);
        });
    }





    // Function to Clear All Filters
    function clearFilters() {
        // Uncheck all checkboxes
        document.querySelectorAll(".category-filter").forEach(checkbox => {
            checkbox.checked = false;
        });
        document.querySelectorAll(".category-filter1").forEach(checkbox => {
            checkbox.checked = false;
        });

        document.querySelectorAll('input[name="priceRange"]').forEach(radio => {
            radio.checked = false;
        });


        // Clear the search input
        document.getElementById("searchBox").value = "";

        // Apply filters again to reset the product list
        applyFilters();
    }


    function addToCart(index) {
    if (!currentProducts || currentProducts.length === 0) {
        console.warn("No products available to add to cart.");
        return;
    }

    if (index < 0 || index >= currentProducts.length) {
        console.warn("Invalid product index:", index);
        return;
    }

    cart.push(currentProducts[index]); // Use `currentProducts` instead of `products`
    updateCart();
}


    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCart();
    }

    function updateCart() {
        cartItems.innerHTML = '';
        let total = 0;

        cart.forEach((item, index) => {
            total += parseFloat(item.price); // Ensure price is treated as a number
            const li = document.createElement('li');
            li.innerHTML = `${item.name} <b>₹${item.price}</b>
            <div class="remove-btn" onclick="removeFromCart(${index})" style="cursor: pointer;"><i style="font-size:22px; padding-left:4px;" class="fa">&#xf00d;</i></div>`;
            cartItems.appendChild(li);
        });

        totalPriceElement.innerText = `${parseFloat(total).toFixed(2)}`;
        cartCountElement.innerText = cart.length;


    }

    function clearCart() {
        if (confirm("Are you sure you want to clear the cart?")) {
            cart = [];
            discountApplied = false;
            discountAmountElement.innerText = "0";
            updateCart();
        }
    }

    function toggleCart() {
        cartSidebar.classList.toggle('open');
    }




    async function redeem_points() {
        let pointsToRedeem = parseInt(document.getElementById('redeemPoints').value);

        if (isNaN(pointsToRedeem) || pointsToRedeem <= 0) {
            alert("Enter a valid number of points.");
            return;
        }

        try {
            let response = await fetch('/redeem_points', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ points_to_redeem: pointsToRedeem }) // No need to send user_id
            });

            let result = await response.json();

            if (result.success) {
                alert(result.message);
                document.getElementById('discountAmount').innerText = result.discount;
                document.getElementById('totalPrice').innerText = Math.max(0, parseInt(document.getElementById('totalPrice').innerText) - result.discount);
                document.getElementById('userPoints').innerText = result.remaining_points;
                document.getElementById('redeemPoints').value = '';
            } else {
                console.warn("Redeem Error:", result.error);
                alert(result.error);
            }
        } catch (error) {
            console.error('Error redeeming points:', error);
            alert('An error occurred.');
        }
    }


    function checkout() {
        // Get the current total price from the cart
        let totalPrice = parseFloat(document.getElementById("totalPrice").innerText);

        if (totalPrice <= 0) {
            alert("Cart is empty! Please add items before proceeding to payment.");
            return;
        }

        var options = {
            key: "rzp_test_PKj7Tx2U0uaaLh", // Replace with your API Key
            amount: totalPrice * 100, // Convert to paise
            currency: "INR",
            name: "ReBottle Rewards-",
            description: "Test Transaction",
            image: "https://yourwebsite.com/logo.png",
            handler: function (response) {
                alert("✅ Payment Successful! \nPayment ID: " + response.razorpay_payment_id);
            },
            prefill: {
                name: "John Doe",
                email: "johndoe@example.com",
                contact: "9876543210"
            },
            theme: {
                color: "#ff9800"
            }
        };

        var rzp = new Razorpay(options);
        rzp.open();
    }



</script>

                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            if (!Array.isArray(data)) {
                throw new Error("Invalid data format received");
            }

            // Store the products globally
            currentProducts = data;

            // Initially display all products
            displayProducts(currentProducts);
        } catch (error) {
            console.error("Error fetching products:", error);
            showError("Failed to load products. Please try again later.");
        }
    }

    // Enhanced price range checker
    function checkPriceRange(price, range) {
        const numPrice = parseFloat(price);
        switch (range) {
            case 'under500':
                return numPrice < 500;
            case '500to1500':
                return numPrice >= 500 && numPrice <= 1500;
            case '1500to2000':
                return numPrice >= 1500 && numPrice <= 2000
            case 'over2000':
                return numPrice > 2000;
            default:
                return true;
        }
    }

    // Enhanced filter function
    function applyFilters() {
        if (!currentProducts.length) {
            console.warn('No products available to filter');
            return;
        }

        // Get filter values
        const searchText = document.getElementById('searchBox')?.value?.toLowerCase().trim() || '';
        const selectedPriceRange = document.querySelector('input[name="priceRange"]:checked')?.value || '';
        const selectedSellers = Array.from(document.querySelectorAll('.category-filter1:checked')).map(input => input.value);
        const selectedCategories = Array.from(document.querySelectorAll('.category-filter:checked')).map(input => input.value);

        // Log filter criteria for debugging
        console.log('Filter Criteria:', {
            searchText,
            selectedPriceRange,
            selectedSellers,
            selectedCategories
        });

        const filteredProducts = currentProducts.filter(product => {
            // Null check for product
            if (!product) return false;

            // Category filter
            const categoryMatch = selectedCategories.length === 0 ||
                selectedCategories.includes(product.category);

            // Seller filter
            const sellerMatch = selectedSellers.length === 0 ||
                selectedSellers.includes(product.seller);

            // Price range filter
            const priceMatch = !selectedPriceRange ||
                checkPriceRange(product.price, selectedPriceRange);

            // Search text filter
            const nameMatch = !searchText ||
                product.name.toLowerCase().includes(searchText);

            // Debug log for filter matches
            if (!categoryMatch || !sellerMatch || !priceMatch || !nameMatch) {
                console.debug('Product filtered out:', {
                    product,
                    categoryMatch,
                    sellerMatch,
                    priceMatch,
                    nameMatch
                });
            }

            return categoryMatch && sellerMatch && priceMatch && nameMatch;
        });

        // Log filtered results
        console.log(`Filtered products: ${filteredProducts.length} of ${currentProducts.length}`);

        // Display filtered products
        displayProducts(filteredProducts);
    }

    // Add event listeners for filter changes
    function initializeFilters() {
        // Price range filters
        document.querySelectorAll('input[name="priceRange"]').forEach(input => {
            input.addEventListener('change', applyFilters);
        });

        // Category filters
        document.querySelectorAll('.category-filter').forEach(input => {
            input.addEventListener('change', applyFilters);
        });

        // Seller filters
        document.querySelectorAll('.category-filter1').forEach(input => {
            input.addEventListener('change', applyFilters);
        });

        // Search box
        const searchBox = document.getElementById('searchBox');
        if (searchBox) {
            // Debounce the search to prevent too many filters
            let timeout;
            searchBox.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(applyFilters, 300);
            });
        }
    }

    // Call this when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        listProducts();
        initializeFilters();
    });
</script>
